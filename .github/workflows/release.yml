name: Release Please

on:
  push:
    branches:
      - master

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4

      - name: Check out release
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v4

      - name: Set up Node
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created }}
        run: npm ci

      - name: Choose npm dist-tag
        if: ${{ steps.release.outputs.release_created }}
        id: npm
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [[ "$VERSION" == *-* ]]; then
            tag="$(node -p 'process.env.VERSION.split("-")[1].split(".")[0]')"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: ${{ steps.release.outputs.release_created }}
        run: npm publish --access public --tag "${{ steps.npm.outputs.tag }}"
