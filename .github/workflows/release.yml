name: Release Please

on:
  push:
    branches:
      - master
      - beta

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          target-branch: ${{ github.ref_name }}
          config-file: ${{ github.ref_name == 'beta' && 'release-please-beta-config.json' || 'release-please-config.json' }}
          manifest-file: .release-please-manifest.json

      - name: Check out release
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v4

      - name: Set up Node
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created }}
        run: npm ci

      - name: Publish to npm
        if: ${{ steps.release.outputs.release_created }}
        env:
          NPM_TAG: ${{ github.ref_name == 'beta' && 'beta' || 'latest' }}
        run: npm publish --access public --provenance --tag "$NPM_TAG"
