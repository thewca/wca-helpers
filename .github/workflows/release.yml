name: Release

on:
  push:
    branches:
      - master

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Read release metadata
        id: release
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const { version } = require('./package.json');
          const match = version.match(/^[0-9]+\.[0-9]+\.[0-9]+(?:-([0-9A-Za-z-]+)(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z.-]+)?$/);
          if (!match) throw new Error(`Invalid semver version: ${version}`);
          const prereleaseTag = match[1];
          console.log(`version=${version}`);
          console.log(`npm_tag=${prereleaseTag || 'latest'}`);
          console.log(`prerelease=${prereleaseTag ? 'true' : 'false'}`);
          NODE

      - name: Check whether exact version is already published
        id: published
        shell: bash
        run: |
          if npm view "@wca/helpers@${{ steps.release.outputs.version }}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.published.outputs.exists != 'true'
        run: npm publish --access public --provenance --tag "${{ steps.release.outputs.npm_tag }}"

      - name: Create tag from package version
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const version = '${{ steps.release.outputs.version }}';
            const tag = `v${version}`;
            const { owner, repo } = context.repo;
            try {
              const { data: ref } = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              if (ref.object.sha !== context.sha) core.info(`Tag ${tag} already exists at ${ref.object.sha}; leaving it unchanged.`);
              else core.info(`Tag ${tag} already exists at this commit.`);
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tag}`, sha: context.sha });
              core.info(`Created tag ${tag}.`);
            }

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ steps.release.outputs.prerelease }}
